<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Hepatic Lobule and Portal Triad Histology">
  <defs>
    <radialGradient id="hepBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fae1e6"/>
    </radialGradient>
    <linearGradient id="portalVeinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c93c4"/>
      <stop offset="100%" stop-color="#2a5c8a"/>
    </linearGradient>
    <linearGradient id="hepaticArtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="bileDuctGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
  </defs>

  <!-- Background / Stroma -->
  <rect width="320" height="240" fill="url(#hepBg)"/>

  <!-- Radiating Hepatocyte Plates & Sinusoids (Background texture) -->
  <g stroke="#f09db3" stroke-width="1.2" opacity="0.45" fill="none">
    <path d="M0 40 Q80 80 140 120"/>
    <path d="M0 90 Q70 105 140 120"/>
    <path d="M0 160 Q80 140 140 120"/>
    <path d="M0 210 Q70 165 140 120"/>
    <path d="M40 0 Q90 60 140 120"/>
    <path d="M220 0 Q180 60 140 120"/>
    <path d="M300 30 Q220 80 140 120"/>
    <path d="M320 100 Q230 110 140 120"/>
    <path d="M320 180 Q230 150 140 120"/>
    <path d="M260 240 Q200 180 140 120"/>
    <path d="M100 240 Q120 180 140 120"/>
  </g>

  <!-- Connective Tissue Sheath of Glisson's Capsule (Portal Canal) -->
  <path d="M150 40 C230 20 280 60 270 150 C260 210 180 220 130 180 C90 150 100 60 150 40 Z" fill="#edd0db" stroke="#880e4f" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.75"/>

  <!-- PORTAL TRIAD STRUCTURES (Center-Right Focus) -->
  <g transform="translate(190, 125)">
    <!-- 1. PORTAL VEIN BRANCH (Largest, thin-walled, irregular/oval lumen) -->
    <g>
      <!-- Vein Wall -->
      <ellipse cx="-15" cy="-25" rx="36" ry="24" fill="#bbdefb" stroke="url(#portalVeinGrad)" stroke-width="3" transform="rotate(-15 -15 -25)"/>
      <!-- Endothelial nuclei lining lumen -->
      <circle cx="-42" cy="-25" r="2.5" fill="#1565c0"/>
      <circle cx="-32" cy="-42" r="2.5" fill="#1565c0"/>
      <circle cx="5" cy="-35" r="2.5" fill="#1565c0"/>
      <circle cx="15" cy="-18" r="2.5" fill="#1565c0"/>
      <circle cx="-10" cy="-7" r="2.5" fill="#1565c0"/>
      <!-- Text label -->
      <text x="-38" y="-23" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#0d47a1">PORTAL VEIN</text>
    </g>

    <!-- 2. HEPATIC ARTERY BRANCH (Thick muscular tunica media, round small lumen) -->
    <g transform="translate(28, 22)">
      <!-- Thick smooth muscle wall -->
      <circle cx="0" cy="0" r="18" fill="#ffcdd2" stroke="#b71c1c" stroke-width="5"/>
      <!-- Small round lumen -->
      <circle cx="0" cy="0" r="7" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
      <!-- Smooth muscle nuclei -->
      <circle cx="-13" cy="0" r="2" fill="#880e4f"/>
      <circle cx="13" cy="0" r="2" fill="#880e4f"/>
      <circle cx="0" cy="-13" r="2" fill="#880e4f"/>
      <circle cx="0" cy="13" r="2" fill="#880e4f"/>
      <text x="-16" y="28" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#b71c1c">HEPATIC ARTERY</text>
    </g>

    <!-- 3. BILE DUCTULE (Distinct simple cuboidal epithelium, round central nuclei) -->
    <g transform="translate(-40, 30)">
      <!-- Basement membrane -->
      <circle cx="0" cy="0" r="20" fill="#c8e6c9" stroke="url(#bileDuctGrad)" stroke-width="2.5"/>
      <!-- Clear Lumen -->
      <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2"/>
      <!-- 8 Cuboidal epithelial cell nuclei -->
      <circle cx="0" cy="-14" r="3" fill="#1b5e20"/>
      <circle cx="10" cy="-10" r="3" fill="#1b5e20"/>
      <circle cx="14" cy="0" r="3" fill="#1b5e20"/>
      <circle cx="10" cy="10" r="3" fill="#1b5e20"/>
      <circle cx="0" cy="14" r="3" fill="#1b5e20"/>
      <circle cx="-10" cy="10" r="3" fill="#1b5e20"/>
      <circle cx="-14" cy="0" r="3" fill="#1b5e20"/>
      <circle cx="-10" cy="-10" r="3" fill="#1b5e20"/>
      <text x="-24" y="32" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#1b5e20">BILE DUCT</text>
    </g>

    <!-- Lymphatic vessel (Colleague in the triad) -->
    <ellipse cx="25" cy="-45" rx="10" ry="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>

  <!-- Surrounding Hepatocytes with Prominent Nuclei (Cord architecture) -->
  <g fill="#d81b60" opacity="0.8">
    <ellipse cx="40" cy="60" rx="6" ry="5"/>
    <ellipse cx="60" cy="70" rx="5.5" ry="5"/>
    <ellipse cx="78" cy="85" rx="6" ry="5"/>
    <ellipse cx="50" cy="130" rx="6" ry="5.5"/>
    <ellipse cx="70" cy="145" rx="6" ry="5"/>
    <ellipse cx="38" cy="180" rx="6" ry="5.5"/>
    <ellipse cx="62" cy="195" rx="5.5" ry="5"/>
  </g>

  <!-- Central Vein Indicator in distance (Top-Left) -->
  <ellipse cx="45" cy="40" rx="20" ry="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="24" y="43" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#1565c0">CENTRAL VEIN</text>

  <!-- Medical Badge -->
  <g transform="translate(10, 222)">
    <rect x="0" y="-14" width="138" height="18" rx="4" fill="#0d47a1" opacity="0.95"/>
    <text x="6" y="-1" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff">PORTAL TRIAD (LIVER)</text>
    <rect x="142" y="-14" width="98" height="18" rx="4" fill="#880e4f" opacity="0.95"/>
    <text x="148" y="-1" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ffffff">H&amp;E HISTOLOGY</text>
  </g>
</svg>
