<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Circle of Willis Cerebral Arterial Anastomosis">
  <defs>
    <radialGradient id="brainBaseBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#101820"/>
    </radialGradient>
    <linearGradient id="arteryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="50%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <filter id="arteryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff1744" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background: Base of Brain silhouette / dark contrast -->
  <rect width="320" height="240" fill="url(#brainBaseBg)"/>

  <!-- Optic Chiasm & Pituitary stalk silhouette at center -->
  <ellipse cx="160" cy="85" rx="14" ry="10" fill="#37474f" opacity="0.6"/>
  <ellipse cx="160" cy="115" rx="8" ry="8" fill="#455a64" opacity="0.7"/> <!-- Infundibulum / Mammillary bodies -->
  <ellipse cx="154" cy="128" rx="4" ry="4" fill="#37474f"/>
  <ellipse cx="166" cy="128" rx="4" ry="4" fill="#37474f"/>

  <!-- Pons & Brainstem outline -->
  <path d="M130 145 Q160 142 190 145 L182 220 Q160 223 138 220 Z" fill="#1e272c" stroke="#37474f" stroke-width="1.2"/>

  <!-- ARTERIAL CIRCLE (CIRCLE OF WILLIS) -->
  <g filter="url(#arteryGlow)" fill="none" stroke="url(#arteryGrad)" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. Basilar Artery (running along midline of pons) -->
    <path d="M160 200 L160 140" stroke-width="7"/>

    <!-- Vertebral Arteries (converging into basilar) -->
    <path d="M142 235 Q150 215 160 200" stroke-width="5.5"/>
    <path d="M178 235 Q170 215 160 200" stroke-width="5.5"/>
    <!-- Anterior Spinal Artery -->
    <path d="M160 208 L160 238" stroke-width="2.5"/>

    <!-- PICA (Posterior Inferior Cerebellar Artery) -->
    <path d="M145 225 C130 225 120 230 115 235" stroke-width="2.5"/>
    <path d="M175 225 C190 225 200 230 205 235" stroke-width="2.5"/>

    <!-- AICA (Anterior Inferior Cerebellar Artery) -->
    <path d="M160 185 C140 185 125 190 118 198" stroke-width="2.8"/>
    <path d="M160 185 C180 185 195 190 202 198" stroke-width="2.8"/>

    <!-- Pontine branches -->
    <path d="M160 170 L148 170 M160 170 L172 170 M160 155 L148 155 M160 155 L172 155" stroke-width="1.5"/>

    <!-- Superior Cerebellar Artery (SCA) -->
    <path d="M160 143 C135 143 120 148 105 152" stroke-width="3"/>
    <path d="M160 143 C185 143 200 148 215 152" stroke-width="3"/>

    <!-- 2. Posterior Cerebral Arteries (PCA - Bifurcation of Basilar) -->
    <path d="M160 140 C145 138 130 135 110 138" stroke-width="5"/>
    <path d="M160 140 C175 138 190 135 210 138" stroke-width="5"/>
    <!-- Distal PCA extending lateral -->
    <path d="M110 138 Q90 140 70 145" stroke-width="4"/>
    <path d="M210 138 Q230 140 250 145" stroke-width="4"/>

    <!-- 3. Posterior Communicating Arteries (PCom - joining PCA to ICA) -->
    <path d="M125 135 C122 120 120 105 125 90" stroke-width="3.5"/>
    <path d="M195 135 C198 120 200 105 195 90" stroke-width="3.5"/>

    <!-- 4. Internal Carotid Arteries (ICA - Cross section / entering circle) -->
    <circle cx="125" cy="88" r="6" fill="#d50000" stroke="#ff8a80" stroke-width="2"/>
    <circle cx="195" cy="88" r="6" fill="#d50000" stroke="#ff8a80" stroke-width="2"/>

    <!-- 5. Middle Cerebral Arteries (MCA - Direct lateral continuation of ICA) -->
    <path d="M125 88 Q90 85 45 80" stroke-width="6"/>
    <path d="M195 88 Q230 85 275 80" stroke-width="6"/>

    <!-- 6. Anterior Cerebral Arteries (ACA - sweeping anteromedially) -->
    <path d="M125 88 C135 65 145 55 155 50" stroke-width="5"/>
    <path d="M195 88 C185 65 175 55 165 50" stroke-width="5"/>

    <!-- Distal ACA (entering longitudinal fissure) -->
    <path d="M155 50 Q152 35 150 15" stroke-width="4.5"/>
    <path d="M165 50 Q168 35 170 15" stroke-width="4.5"/>

    <!-- 7. Anterior Communicating Artery (ACom - connecting both ACAs) -->
    <path d="M154 50 L166 50" stroke-width="4"/>
  </g>

  <!-- Berry Aneurysm Common Site Marker (ACom junction) -->
  <circle cx="155" cy="50" r="3.5" fill="#ffeb3b" stroke="#f57f17" stroke-width="1.2"/>

  <!-- High-Yield Labels -->
  <g font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#eceff1">
    <text x="172" y="48" fill="#ffd54f">ACom</text>
    <text x="96" y="65">ACA</text>
    <text x="210" y="65">ACA</text>
    <text x="48" y="74">MCA</text>
    <text x="250" y="74">MCA</text>
    <text x="98" y="112" fill="#80cbc4">PCom</text>
    <text x="202" y="112" fill="#80cbc4">PCom</text>
    <text x="75" y="135">PCA</text>
    <text x="225" y="135">PCA</text>
    <text x="168" y="170" fill="#ff8a80">BASILAR</text>
    <text x="110" y="228">VERTEBRAL</text>
  </g>

  <!-- Medical Badge -->
  <g transform="translate(10, 222)">
    <rect x="0" y="-14" width="138" height="18" rx="4" fill="#c62828" opacity="0.95"/>
    <text x="6" y="-1" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff">CIRCLE OF WILLIS</text>
    <rect x="142" y="-14" width="108" height="18" rx="4" fill="#00695c" opacity="0.95"/>
    <text x="148" y="-1" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ffffff">NEUROANGIOGRAPHY</text>
  </g>
</svg>
