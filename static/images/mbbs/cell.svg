<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="MBBS Human Cell Ultrastructure and Organelles">
  <defs>
    <radialGradient id="cytoBg" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="60%" stop-color="#c8e6c9"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </radialGradient>
    <radialGradient id="nucGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b39ddb"/>
      <stop offset="60%" stop-color="#7e57c2"/>
      <stop offset="100%" stop-color="#4527a0"/>
    </radialGradient>
    <radialGradient id="nucleolusGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#311b92"/>
      <stop offset="100%" stop-color="#12005e"/>
    </radialGradient>
    <linearGradient id="mitoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="golgiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#00838f"/>
    </linearGradient>
  </defs>

  <!-- Background / Extracellular Fluid -->
  <rect width="320" height="240" fill="#f1f8e9"/>

  <!-- Plasma Membrane (Phospholipid Bilayer Contour) -->
  <path d="M160 15 C245 12 300 55 305 120 C310 185 240 230 160 232 C75 235 15 190 15 120 C15 50 70 18 160 15 Z" fill="url(#cytoBg)" stroke="#2e7d32" stroke-width="3.5"/>

  <!-- Cytoskeletal Microfilaments & Microtubules -->
  <g stroke="#81c784" stroke-width="1" opacity="0.6" fill="none">
    <path d="M40 70 Q120 40 200 45 Q260 50 285 80"/>
    <path d="M35 150 Q110 180 190 195 Q250 200 280 170"/>
    <path d="M60 40 Q80 140 100 210"/>
    <path d="M220 30 Q240 130 250 215"/>
  </g>

  <!-- 1. NUCLEUS (Centrally located, dominant organelle with Double Membrane & Pores) -->
  <g transform="translate(130, 115)">
    <!-- Nuclear Envelope (Double membrane with nuclear pores) -->
    <ellipse cx="0" cy="0" rx="55" ry="46" fill="url(#nucGrad)" stroke="#311b92" stroke-width="3" stroke-dasharray="8 2"/>
    <!-- Heterochromatin clumps lining inner envelope -->
    <ellipse cx="-35" cy="-20" rx="7" ry="5" fill="#12005e" opacity="0.6"/>
    <ellipse cx="32" cy="-22" rx="8" ry="4.5" fill="#12005e" opacity="0.6"/>
    <ellipse cx="28" cy="25" rx="9" ry="5" fill="#12005e" opacity="0.6"/>
    <ellipse cx="-30" cy="22" rx="8" ry="4" fill="#12005e" opacity="0.6"/>
    <!-- Nucleolus (Site of rRNA synthesis & ribosome biogenesis) -->
    <circle cx="-6" cy="-6" r="16" fill="url(#nucleolusGrad)" stroke="#000000" stroke-width="1.2"/>
    <text x="-20" y="-3" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#ede7f6">NUCLEOLUS</text>
  </g>

  <!-- 2. ROUGH ENDOPLASMIC RETICULUM (RER - Continuous with outer nuclear membrane) -->
  <g transform="translate(130, 115)" fill="none" stroke="#5e35b1" stroke-width="3" stroke-linecap="round">
    <!-- Concentric cisternae studded with ribosomes -->
    <path d="M-58 -15 C-75 -35 -40 -65 0 -62 C35 -60 65 -45 68 -20"/>
    <path d="M-64 -8 C-85 -25 -50 -75 0 -72 C45 -70 78 -50 75 -10"/>
    <!-- Ribosomes (Studded blue-purple dots on RER) -->
    <g fill="#1a237e" stroke="none">
      <circle cx="-50" cy="-45" r="1.5"/><circle cx="-35" cy="-56" r="1.5"/><circle cx="-15" cy="-63" r="1.5"/>
      <circle cx="10" cy="-63" r="1.5"/><circle cx="30" cy="-58" r="1.5"/><circle cx="50" cy="-48" r="1.5"/>
      <circle cx="-60" cy="-35" r="1.5"/><circle cx="-25" cy="-71" r="1.5"/><circle cx="20" cy="-71" r="1.5"/>
      <circle cx="60" cy="-60" r="1.5"/>
    </g>
  </g>

  <!-- 3. SMOOTH ENDOPLASMIC RETICULUM (SER - Tubular network for lipid & steroid synthesis) -->
  <g transform="translate(60, 65)" stroke="#7e57c2" stroke-width="2.5" fill="none">
    <path d="M0 0 Q15 -10 25 5 Q35 20 20 28 Q5 35 -5 20 Z"/>
    <path d="M15 5 Q35 -5 45 12 Q45 28 30 25"/>
    <text x="-15" y="-5" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#512da8" stroke="none">SER</text>
  </g>

  <!-- 4. GOLGI APPARATUS (Cis, medial, trans cisternae & secretory vesicles) -->
  <g transform="translate(230, 140)">
    <g fill="none" stroke="url(#golgiGrad)" stroke-width="3.5" stroke-linecap="round">
      <path d="M-15 -25 C0 -15 10 5 0 25"/>
      <path d="M-8 -22 C5 -12 15 5 5 22"/>
      <path d="M-1 -18 C10 -8 20 5 10 18"/>
      <path d="M6 -14 C15 -5 23 4 15 14"/>
    </g>
    <!-- Secretory Vesicles budding off Trans-Golgi network -->
    <circle cx="22" cy="-10" r="3.5" fill="#00acc1"/>
    <circle cx="26" cy="5" r="3" fill="#00acc1"/>
    <circle cx="22" cy="18" r="3.5" fill="#00acc1"/>
    <text x="-12" y="36" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#006064">GOLGI</text>
  </g>

  <!-- 5. MITOCHONDRIA (Double membrane with Cristae & Matrix - Powerhouse of the Cell) -->
  <!-- Mitochondrion 1 (Upper Right) -->
  <g transform="translate(225, 65) rotate(25)">
    <ellipse cx="0" cy="0" rx="26" ry="14" fill="url(#mitoGrad)" stroke="#bf360c" stroke-width="1.8"/>
    <!-- Folded Cristae -->
    <path d="M-18 0 Q-14 -8 -10 0 M-8 0 Q-4 8 0 0 M2 0 Q6 -8 10 0 M12 0 Q16 8 20 0" stroke="#ffe082" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="-18" y="22" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#bf360c">MITOCHONDRIA</text>
  </g>

  <!-- Mitochondrion 2 (Bottom Left) -->
  <g transform="translate(75, 175) rotate(-35)">
    <ellipse cx="0" cy="0" rx="24" ry="13" fill="url(#mitoGrad)" stroke="#bf360c" stroke-width="1.8"/>
    <path d="M-16 0 Q-12 -7 -8 0 M-6 0 Q-2 7 2 0 M4 0 Q8 -7 12 0 M14 0 Q18 7 18 0" stroke="#ffe082" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 6. LYSOSOMES & PEROXISOMES (Digestive acid hydrolase vesicles) -->
  <circle cx="65" cy="120" r="7.5" fill="#e91e63" stroke="#880e4f" stroke-width="1.2"/>
  <circle cx="70" cy="135" r="5" fill="#f06292"/>
  <circle cx="185" cy="195" r="6" fill="#ab47bc" stroke="#4a148c" stroke-width="1"/>

  <!-- 7. CENTROSOME with Pair of Centrioles (MTOC for spindle during mitosis) -->
  <g transform="translate(185, 80)">
    <rect x="-6" y="-3" width="12" height="6" fill="#ffb300" stroke="#e65100" stroke-width="1"/>
    <rect x="-3" y="1" width="6" height="12" fill="#ffb300" stroke="#e65100" stroke-width="1"/>
    <circle cx="0" cy="4" r="10" stroke="#ffd54f" stroke-width="0.8" fill="none" stroke-dasharray="2 2"/>
  </g>

  <!-- Medical Badge -->
  <g transform="translate(10, 222)">
    <rect x="0" y="-14" width="138" height="18" rx="4" fill="#1b5e20" opacity="0.95"/>
    <text x="6" y="-1" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff">CELL ULTRASTRUCTURE</text>
    <rect x="142" y="-14" width="102" height="18" rx="4" fill="#2e7d32" opacity="0.95"/>
    <text x="148" y="-1" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ffffff">TEM ORGANELLES</text>
  </g>
</svg>
