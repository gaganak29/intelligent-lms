<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Polymorphonuclear Neutrophil Blood Film">
  <defs>
    <radialGradient id="rbcGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff9999"/>
      <stop offset="35%" stop-color="#ff6b6b"/>
      <stop offset="70%" stop-color="#e84141"/>
      <stop offset="100%" stop-color="#c02727"/>
    </radialGradient>
    <radialGradient id="pmnCytoplasm" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f8e1eb"/>
      <stop offset="80%" stop-color="#f3d1e1"/>
      <stop offset="100%" stop-color="#e8bccf"/>
    </radialGradient>
    <radialGradient id="pmnNucleus" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6a1b9a"/>
      <stop offset="60%" stop-color="#4a148c"/>
      <stop offset="100%" stop-color="#240046"/>
    </radialGradient>
    <filter id="granuleNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.3  0 0 0 0 0.5  0 0 0 0.25 0"/>
      <feComposite in2="SourceGraphic" in="gl" operator="in"/>
    </filter>
  </defs>

  <!-- Background Plasma (Leishman stain glass slide tone) -->
  <rect width="320" height="240" fill="#fcf6f9"/>

  <!-- Background Red Blood Cells (Normocytic Normochromic Erythrocytes with Central Pallor) -->
  <g>
    <!-- Cluster of RBCs -->
    <g transform="translate(45, 50)">
      <circle cx="0" cy="0" r="22" fill="url(#rbcGrad)"/>
      <circle cx="0" cy="0" r="9" fill="#ffcdd2" opacity="0.85"/>
    </g>
    <g transform="translate(85, 35)">
      <circle cx="0" cy="0" r="21" fill="url(#rbcGrad)"/>
      <circle cx="0" cy="0" r="8" fill="#ffcdd2" opacity="0.85"/>
    </g>
    <g transform="translate(30, 110)">
      <circle cx="0" cy="0" r="22" fill="url(#rbcGrad)"/>
      <circle cx="0" cy="0" r="8.5" fill="#ffcdd2" opacity="0.85"/>
    </g>
    <g transform="translate(40, 175)">
      <circle cx="0" cy="0" r="21" fill="url(#rbcGrad)"/>
      <circle cx="0" cy="0" r="8" fill="#ffcdd2" opacity="0.85"/>
    </g>
    <g transform="translate(90, 205)">
      <circle cx="0" cy="0" r="23" fill="url(#rbcGrad)"/>
      <circle cx="0" cy="0" r="9" fill="#ffcdd2" opacity="0.85"/>
    </g>
    <g transform="translate(240, 45)">
      <circle cx="0" cy="0" r="22" fill="url(#rbcGrad)"/>
      <circle cx="0" cy="0" r="8.5" fill="#ffcdd2" opacity="0.85"/>
    </g>
    <g transform="translate(285, 80)">
      <circle cx="0" cy="0" r="21" fill="url(#rbcGrad)"/>
      <circle cx="0" cy="0" r="8" fill="#ffcdd2" opacity="0.85"/>
    </g>
    <g transform="translate(265, 145)">
      <circle cx="0" cy="0" r="22" fill="url(#rbcGrad)"/>
      <circle cx="0" cy="0" r="9" fill="#ffcdd2" opacity="0.85"/>
    </g>
    <g transform="translate(285, 200)">
      <circle cx="0" cy="0" r="22" fill="url(#rbcGrad)"/>
      <circle cx="0" cy="0" r="8.5" fill="#ffcdd2" opacity="0.85"/>
    </g>
    <g transform="translate(225, 215)">
      <circle cx="0" cy="0" r="21" fill="url(#rbcGrad)"/>
      <circle cx="0" cy="0" r="8" fill="#ffcdd2" opacity="0.85"/>
    </g>
  </g>

  <!-- Blood Platelets / Thrombocytes (Small purple fragments) -->
  <g fill="#7b1fa2">
    <ellipse cx="230" cy="100" rx="3.5" ry="2.5" transform="rotate(20 230 100)"/>
    <ellipse cx="235" cy="104" rx="2.5" ry="2" transform="rotate(-15 235 104)"/>
    <ellipse cx="105" cy="165" rx="3" ry="2"/>
  </g>

  <!-- CENTRAL PMN NEUTROPHIL (12-15 μm, dominant cell) -->
  <g transform="translate(160, 120)">
    <!-- Neutrophil Cytoplasm (Salmon-pink/lilac with fine granules) -->
    <ellipse cx="0" cy="0" rx="55" ry="52" fill="url(#pmnCytoplasm)" stroke="#d81b60" stroke-width="1.2"/>

    <!-- Fine Azurophilic & Specific Neutrophilic Granules (Dusting) -->
    <g fill="#ba68c8" opacity="0.45">
      <circle cx="-35" cy="-25" r="1.5"/><circle cx="-20" cy="-35" r="1.2"/><circle cx="10" cy="-40" r="1.5"/>
      <circle cx="35" cy="-20" r="1.2"/><circle cx="42" cy="0" r="1.5"/><circle cx="30" cy="25" r="1.2"/>
      <circle cx="0" cy="40" r="1.5"/><circle cx="-25" cy="32" r="1.2"/><circle cx="-42" cy="10" r="1.5"/>
      <circle cx="-5" cy="-5" r="1.2"/><circle cx="15" cy="8" r="1.5"/><circle cx="-15" cy="8" r="1.2"/>
    </g>

    <!-- Polymorphic Multi-Lobed Nucleus (4 Connected Lobes with Chromatin Clumping) -->
    <!-- Lobe 1 (Upper Left) -->
    <ellipse cx="-22" cy="-18" rx="16" ry="13" fill="url(#pmnNucleus)" transform="rotate(-20 -22 -18)"/>
    <!-- Thin Chromatin Strand 1->2 -->
    <path d="M-10 -15 Q-2 -18 5 -20" stroke="#4a148c" stroke-width="3.5" fill="none"/>
    <!-- Lobe 2 (Upper Right) -->
    <ellipse cx="18" cy="-18" rx="15" ry="12" fill="url(#pmnNucleus)" transform="rotate(25 18 -18)"/>
    <!-- Drumstick / Barr Body on Lobe 2 (Inactivated X Chromosome in Females) -->
    <path d="M26 -28 L34 -36" stroke="#4a148c" stroke-width="2.5" fill="none"/>
    <circle cx="35" cy="-38" r="3.2" fill="#311b92"/>
    <!-- Thin Chromatin Strand 2->3 -->
    <path d="M24 -8 Q26 4 20 12" stroke="#4a148c" stroke-width="3.5" fill="none"/>
    <!-- Lobe 3 (Lower Right) -->
    <ellipse cx="15" cy="20" rx="17" ry="14" fill="url(#pmnNucleus)" transform="rotate(-15 15 20)"/>
    <!-- Thin Chromatin Strand 3->4 -->
    <path d="M4 22 Q-6 24 -14 18" stroke="#4a148c" stroke-width="3.5" fill="none"/>
    <!-- Lobe 4 (Lower Left) -->
    <ellipse cx="-20" cy="14" rx="15" ry="12" fill="url(#pmnNucleus)" transform="rotate(35 -20 14)"/>

    <!-- Chromatin Heterochromatin / Euchromatin Clump Details -->
    <circle cx="-24" cy="-20" r="3" fill="#120024" opacity="0.6"/>
    <circle cx="16" cy="-20" r="3" fill="#120024" opacity="0.6"/>
    <circle cx="14" cy="18" r="3.5" fill="#120024" opacity="0.6"/>
    <circle cx="-22" cy="12" r="3" fill="#120024" opacity="0.6"/>
  </g>

  <!-- Medical Badge -->
  <g transform="translate(10, 222)">
    <rect x="0" y="-14" width="138" height="18" rx="4" fill="#4a148c" opacity="0.95"/>
    <text x="6" y="-1" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff">NEUTROPHIL (PMN)</text>
    <rect x="142" y="-14" width="112" height="18" rx="4" fill="#c2185b" opacity="0.95"/>
    <text x="148" y="-1" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ffffff">LEISHMAN STAIN 1000x</text>
  </g>
</svg>
