<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="MBBS Bone Osteology and Haversian System Microanatomy">
  <defs>
    <radialGradient id="osteonBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#eddcd2"/>
    </radialGradient>
    <linearGradient id="boneGrossGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff1e6"/>
      <stop offset="50%" stop-color="#ddbea9"/>
      <stop offset="100%" stop-color="#cb997e"/>
    </linearGradient>
    <radialGradient id="canalGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2b1a13"/>
      <stop offset="70%" stop-color="#140b07"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="240" fill="url(#osteonBg)"/>

  <!-- LEFT: MACROSCOPIC LONG BONE ANATOMY (Femur / Humerus) -->
  <g transform="translate(15, 15)">
    <!-- Proximal Epiphysis -->
    <path d="M40 30 C30 10 10 15 15 35 C18 48 30 55 35 70 L35 155 C30 170 18 178 15 190 C10 210 30 215 40 195 C50 215 70 210 65 190 C62 178 50 170 45 155 L45 70 C50 55 62 48 65 35 C70 15 50 10 40 30 Z" fill="url(#boneGrossGrad)" stroke="#a57960" stroke-width="2"/>

    <!-- Epiphyseal Growth Plate (Physis) -->
    <line x1="22" y1="42" x2="58" y2="42" stroke="#457b9d" stroke-width="2.5" stroke-dasharray="3 1.5"/>
    <text x="65" y="44" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#1d3557">GROWTH PLATE</text>

    <!-- Medullary Cavity with Yellow Marrow in Diaphysis -->
    <rect x="37" y="75" width="6" height="75" rx="3" fill="#ffe6a7" stroke="#d4a373" stroke-width="0.8"/>
    <!-- Compact Bone Cortex (Thick diaphyseal cortical bone) -->
    <line x1="35" y1="75" x2="35" y2="150" stroke="#6b4c3e" stroke-width="2"/>
    <line x1="45" y1="75" x2="45" y2="150" stroke="#6b4c3e" stroke-width="2"/>

    <!-- Labels -->
    <text x="2" y="24" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#6b4c3e">EPIPHYSIS</text>
    <text x="2" y="112" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#6b4c3e">DIAPHYSIS</text>
  </g>

  <!-- Magnification Callout / Connecting Line to Osteon -->
  <path d="M60 110 L140 70 M60 120 L140 160" stroke="#b08968" stroke-width="1.2" stroke-dasharray="4 2" fill="none"/>

  <!-- RIGHT: MICROSCOPIC OSTEON / HAVERSIAN SYSTEM (Compact Bone Histology) -->
  <g transform="translate(225, 115)">
    <!-- Outer Cement Line -->
    <ellipse cx="0" cy="0" rx="76" ry="76" fill="#faedcd" stroke="#6b4c3e" stroke-width="2" stroke-dasharray="6 3"/>

    <!-- Concentric Lamellae Rings of Mineralized Matrix -->
    <g fill="none" stroke="#b08968" stroke-width="1.2" opacity="0.6">
      <circle cx="0" cy="0" r="62"/>
      <circle cx="0" cy="0" r="48"/>
      <circle cx="0" cy="0" r="34"/>
      <circle cx="0" cy="0" r="20"/>
    </g>

    <!-- Radiating Microscopic Canaliculi (Micro-canals connecting lacunae) -->
    <g stroke="#7f5539" stroke-width="0.7" opacity="0.45">
      <line x1="0" y1="0" x2="-58" y2="-38"/><line x1="0" y1="0" x2="0" y2="-68"/>
      <line x1="0" y1="0" x2="58" y2="-38"/><line x1="0" y1="0" x2="68" y2="0"/>
      <line x1="0" y1="0" x2="58" y2="38"/><line x1="0" y1="0" x2="0" y2="68"/>
      <line x1="0" y1="0" x2="-58" y2="38"/><line x1="0" y1="0" x2="-68" y2="0"/>
    </g>

    <!-- Osteocytes in Lacunae (Spider-like cells arranged concentrically) -->
    <g fill="#3e2723">
      <!-- Ring 1 -->
      <ellipse cx="-16" cy="-12" rx="4" ry="2" transform="rotate(35 -16 -12)"/>
      <ellipse cx="16" cy="-12" rx="4" ry="2" transform="rotate(-35 16 -12)"/>
      <ellipse cx="20" cy="6" rx="4" ry="2" transform="rotate(80 20 6)"/>
      <ellipse cx="0" cy="18" rx="4" ry="2"/>
      <ellipse cx="-20" cy="6" rx="4" ry="2" transform="rotate(-80 -20 6)"/>

      <!-- Ring 2 -->
      <ellipse cx="-34" cy="-24" rx="4.5" ry="2.2" transform="rotate(35 -34 -24)"/>
      <ellipse cx="0" cy="-40" rx="4.5" ry="2.2"/>
      <ellipse cx="34" cy="-24" rx="4.5" ry="2.2" transform="rotate(-35 34 -24)"/>
      <ellipse cx="45" cy="12" rx="4.5" ry="2.2" transform="rotate(80 45 12)"/>
      <ellipse cx="24" cy="38" rx="4.5" ry="2.2" transform="rotate(-30 24 38)"/>
      <ellipse cx="-24" cy="38" rx="4.5" ry="2.2" transform="rotate(30 -24 38)"/>
      <ellipse cx="-45" cy="12" rx="4.5" ry="2.2" transform="rotate(-80 -45 12)"/>

      <!-- Ring 3 -->
      <ellipse cx="-48" cy="-38" rx="4.5" ry="2.2" transform="rotate(38 -48 -38)"/>
      <ellipse cx="0" cy="-60" rx="4.5" ry="2.2"/>
      <ellipse cx="48" cy="-38" rx="4.5" ry="2.2" transform="rotate(-38 48 -38)"/>
      <ellipse cx="60" cy="16" rx="4.5" ry="2.2" transform="rotate(85 60 16)"/>
      <ellipse cx="36" cy="50" rx="4.5" ry="2.2" transform="rotate(-35 36 50)"/>
      <ellipse cx="-36" cy="50" rx="4.5" ry="2.2" transform="rotate(35 -36 50)"/>
      <ellipse cx="-60" cy="16" rx="4.5" ry="2.2" transform="rotate(-85 -60 16)"/>
    </g>

    <!-- Central Haversian Canal (Neurovascular Bundle) -->
    <circle cx="0" cy="0" r="13" fill="url(#canalGrad)" stroke="#4e342e" stroke-width="1.8"/>
    <!-- Central Artery -->
    <circle cx="-3" cy="-2" r="3.5" fill="#e53935"/>
    <!-- Central Vein -->
    <circle cx="3.5" cy="1" r="3" fill="#1e88e5"/>
    <!-- Nerve Fiber -->
    <circle cx="0" cy="5" r="1.8" fill="#ffeb3b"/>
  </g>

  <!-- Labels -->
  <text x="175" y="32" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#6b4c3e">HAVERSIAN CANAL</text>
  <text x="175" y="198" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#7f5539">OSTEOCYTE LACUNAE</text>

  <!-- Medical Badge -->
  <g transform="translate(10, 222)">
    <rect x="0" y="-14" width="138" height="18" rx="4" fill="#5c4033" opacity="0.95"/>
    <text x="6" y="-1" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff">OSTEON / HAVERSIAN</text>
    <rect x="142" y="-14" width="102" height="18" rx="4" fill="#8d6e63" opacity="0.95"/>
    <text x="148" y="-1" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ffffff">BONE HISTOLOGY</text>
  </g>
</svg>
