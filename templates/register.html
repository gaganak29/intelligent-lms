{% extends 'base.html' %}

{% block title %}Create Student Account - IntelliLearn{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card card-modern p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="stat-icon bg-success text-white mx-auto mb-3">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h1 class="h3 fw-bold text-dark mb-2">Create Student Account</h1>
          <p class="text-muted mb-0">Your Student ID is generated automatically after registration.</p>
        </div>

        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post">
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Full Name</label>
            <input id="name" name="name" type="text" class="form-control form-control-lg" required>
          </div>
          <div class="mb-3">
            <label for="category" class="form-label fw-semibold">Learning Category</label>
            <select id="category" name="category" class="form-select form-select-lg" required>
              <option value="highschool">High School</option>
              <option value="puc_degree">PUC &amp; Degree</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input id="password" name="password" type="password" class="form-control form-control-lg" minlength="6" required>
          </div>
          <div class="mb-4">
            <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
            <input id="confirm_password" name="confirm_password" type="password" class="form-control form-control-lg" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill fw-bold">
            <i class="fa-solid fa-user-plus me-2"></i>Create Account
          </button>
        </form>

        <div class="text-center mt-4">
          <a href="{{ url_for('login') }}" class="small fw-semibold">Back to login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
